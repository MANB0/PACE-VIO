  camera:
    fx: 3.555501231680637e+02
    fy: 3.558306641144621e+02
    cx: 3.402152953048657e+02
    cy: 1.945248502757250e+02

  bl: 0.12
  format: jpg

  gravity: 9.786139144897462
  imu_window_ns: 100000000
  imu_fallback_max_dt_ns: -1
  auto_estimate_time_offset: true
  imu_time_offset_ns: 0
