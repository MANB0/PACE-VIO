Common:
  device: &device cuda

Odometry:
  name: MACVO-Fast-IMU
  args:
    device: *device
    edgewidth: 32
    num_point: 200
    match_cov_default: 0.25
    profile: false
    mapping: true
    imu_rot_prior_std: 0.006
    # IMU noise params: continuous-time noise density (m/s^2/sqrt(Hz), rad/s/sqrt(Hz)).
    # Based on ZED 2i calibration: per-sample sigma -> continuous sigma_cont = sigma_sample * sqrt(f_sample).
    # AccelSigma=0.00277 -> sigma_acc ~= 0.055; AngVelSigma=0.00123 -> sigma_gyro ~= 0.025.
    imu_sigma_acc: 0.06
    imu_sigma_gyro: 0.025
    imu_sigma_acc_w: 0.001
    imu_sigma_gyro_w: 0.0005
    imu_gravity_rp_correction_gain: 0.0
    imu_gravity_rp_acc_tol: 0.12
    imu_gravity_rp_window: 24
    # HoloOcean IMU is now transformed FLU->NED correctly. Keep acceleration
    # translation disabled by default until a coordinate-safe full-sequence
    # ablation proves it helps; gyro/rotation is the safer IMU signal here.
    imu_trans_prior_enable: false
    # Legacy URAF uses IMU only in optimizer write-back; keep prepose fusion off
    # so this config remains comparable to the original URAF(lambda=0.5) runs.
    imu_pose_fusion_enable: false
    imu_pose_fusion_alpha: 0.5
    imu_legacy_gyro_prior_enable: false
    imu_legacy_gyro_sign: [1.0, 1.0, 1.0]

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: fp16
      dec_dtype: bf16
      decoder_depth: 12
      enforce_positive_disparity: false

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: TwoFrame_PGO
    args:
      device: cpu
      vectorize: true
      parallel: true
      graph_type: disp
      autodiff: false
      imu_rot_prior: false
      imu_trans_prior_scale: 0.05
      # Paper-facing default: DUA uses MACVO uncertainty to switch IMU constraints
      # only under online visual degradation. The legacy "URAF(lambda=0.5)"
      # table is still reproduced by Scripts/bench_full.py --candidates uraf.
      post_imu_fusion_enable: true
      post_imu_fusion_prepose_enable: false
      post_imu_fusion_mode: dua
      uraf_lambda: 0.5
      # Shared post-fusion floors
      post_imu_fusion_visual_trans_std: 0.08
      post_imu_fusion_visual_rot_std: 0.035
      post_imu_fusion_cov_scale: 1.0
      post_imu_fusion_imu_trans_enable: false
      post_imu_fusion_imu_rot_enable: true
      post_imu_fusion_imu_trans_z_only: false
      post_imu_fusion_imu_trans_std_floor: 0.18
      post_imu_fusion_imu_trans_xy_std_floor: 0.45
      post_imu_fusion_imu_trans_z_std_floor: 0.18
      post_imu_fusion_imu_rot_std_floor: 0.055
      post_imu_fusion_imu_rot_rp_std_floor: 0.075
      post_imu_fusion_imu_rot_yaw_std_floor: 0.055
      # True-yaw residual and motion-gated translation recoupling
      post_imu_fusion_yaw_residual_enable: true
      post_imu_fusion_yaw_residual_gain: 0.35
      post_imu_fusion_yaw_residual_max_corr: 0.06
      post_imu_fusion_yaw_residual_turn_ref: 0.10
      post_imu_fusion_yaw_residual_disagree_ref: 0.50
      post_imu_fusion_yaw_blend_imu_scale: 1.0
      post_imu_fusion_yaw_trans_couple_enable: true
      post_imu_fusion_yaw_trans_couple_gain: 0.35
      post_imu_fusion_yaw_trans_couple_max_angle: 0.08
      post_imu_fusion_yaw_trans_couple_imu_trans_ref: 0.08
      # Near-stationary turn sliding suppression
      post_imu_fusion_xy_turn_residual_enable: true
      post_imu_fusion_xy_turn_residual_yaw_ref: 0.10
      post_imu_fusion_xy_turn_residual_imu_trans_ref: 0.05
      post_imu_fusion_xy_turn_visual_std_scale_max: 2.0
      post_imu_fusion_turn_visual_z_std_scale_max: 1.6
      # BAGF online quality and DCS-style gating
      bagf_visual_cov_ref: 0.02
      bagf_obs_count_ref: 120.0
      bagf_depth_spread_ref: 0.35
      bagf_visual_quality_std_gain: 1.25
      bagf_good_visual_imu_relax: 6.0
      bagf_skip_healthy_visual: true
      bagf_skip_obs_quality: 0.65
      bagf_skip_coverage_quality: 0.30
      bagf_skip_depth_quality: 0.30
      bagf_max_active_streak: 180
      bagf_cooldown_frames: 360
      bagf_visual_quality_enable_thresh: 0.24
      bagf_apply_score_min: 0.80
      bagf_z_apply_score_min: 0.88
      bagf_rot_apply_score_min: 0.80
      bagf_dcs_phi: 2.0
      bagf_dcs_scale_max: 16.0
      bagf_xy_enable_quality_thresh: 0.18
      bagf_xy_consistency_thresh: 0.70
      bagf_xy_motion_ref: 0.04
      bagf_yaw_blend_max_good: 0.03
      bagf_yaw_blend_max_bad: 0.12
      # DUA: Degradation-aware Uncertainty Adaptive fusion
      dua_visual_cov_good: 0.012
      dua_visual_cov_bad: 0.060
      dua_obs_count_ref: 130.0
      dua_coverage_ref: 0.55
      dua_depth_spread_ref: 0.35
      dua_degrade_ema_alpha: 0.35
      dua_degrade_onset: 0.70
      dua_degrade_release: 0.58
      dua_enable_visual_quality_max: 0.24
      dua_visual_std_gain: 1.6
      dua_dcs_phi: 2.5
      dua_switch_floor: 0.08
      dua_good_visual_relax: 5.0
      dua_rot_degrade_min: 0.80
      dua_z_degrade_min: 0.80
      dua_xy_degrade_min: 0.84
      dua_rot_switch_min: 0.28
      dua_z_switch_min: 0.22
      dua_xy_switch_min: 0.45
      dua_xy_cos_min: 0.65
      dua_xy_motion_min: 0.04
      dua_correction_gain: 0.45
      dua_max_trans_correction: 0.035
      dua_max_rot_correction: 0.035
      dua_yaw_blend_max: 0.10
Data: !include ../../Sequence/holoocean_imu.yaml
Preprocess: !include ../Common/Preprocess.yaml
